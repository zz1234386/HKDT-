<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航电机载设备行业周报 · 实时更新</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        background: #f1f5fc; color: #0b1e3a; line-height: 1.6;
        padding: 1.5rem; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center;
    }
    .app { max-width: 1180px; width: 100%; }

    /* ---------- 头部 ---------- */
    .header {
        background: white; border-radius: 1.75rem; padding: 1.5rem 2rem;
        box-shadow: 0 8px 24px -8px rgba(0,20,50,.15);
        border: 1px solid #fff; margin-bottom: 1.25rem;
    }
    .header-top {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .header-title h1 {
        font-size: 1.8rem; font-weight: 700; letter-spacing: -.02em; color: #0b1e3a;
        display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    }
    .header-title h1 .period-badge {
        background: #eef4ff; color: #1e4faf; font-size: .85rem; font-weight: 600;
        padding: .25rem .9rem; border-radius: 3rem; border: 1px solid #b9d1ff;
    }
    .header-meta {
        display: flex; flex-wrap: wrap; gap: 1rem; margin-top: .4rem;
        font-size: .85rem; color: #5e7290;
    }
    .header-positioning {
        margin-top: .7rem; font-size: .82rem; color: #4a5e7c;
        background: #f8fafd; padding: .55rem 1rem; border-radius: .75rem;
        border-left: 3px solid #3b82f6;
    }

    /* ---------- 控制栏 ---------- */
    .control-bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
        background: white; padding: 1rem 1.5rem; border-radius: 1.5rem;
        box-shadow: 0 8px 20px -8px rgba(0,20,50,.12);
        border: 1px solid #fff; margin-bottom: 1.5rem;
    }
    .period-switch { display: flex; align-items: center; gap: .5rem; }
    .period-switch button {
        background: #f0f5ff; border: 1px solid #cdddec; color: #1e4faf;
        padding: .5rem 1rem; border-radius: 3rem; font-size: .85rem; font-weight: 600;
        cursor: pointer; transition: all .15s;
        display: inline-flex; align-items: center; gap: .3rem;
    }
    .period-switch button:hover:not(:disabled) { background: #e0eaff; border-color: #3b82f6; }
    .period-switch button:disabled { opacity: .4; cursor: not-allowed; }
    .period-display {
        font-size: .9rem; font-weight: 600; color: #0b1e3a; padding: .5rem 1rem;
        background: #eef4ff; border-radius: 3rem; border: 1px solid #b9d1ff;
        min-width: 140px; text-align: center;
    }
    .period-display .date { font-size: .72rem; color: #5e7290; font-weight: 500; display: block; }

    .search-box { flex: 1; min-width: 180px; position: relative; }
    .search-box input {
        width: 100%; padding: .6rem 1rem .6rem 2.5rem;
        border: 1px solid #cdddec; border-radius: 3rem; font-size: .9rem;
        outline: none; transition: border .15s, box-shadow .15s;
        background: #f8fafd; color: #0b1e3a;
    }
    .search-box input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); background: white; }
    .search-box::before {
        content: "🔍"; position: absolute; left: 1rem; top: 50%;
        transform: translateY(-50%); font-size: .9rem; pointer-events: none; z-index: 1;
    }

    .filter-select {
        padding: .6rem 1rem; border: 1px solid #cdddec; border-radius: 3rem;
        font-size: .85rem; background: #f8fafd; color: #0b1e3a; cursor: pointer;
        outline: none; font-weight: 500; transition: border .15s;
    }
    .filter-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

    .match-info { font-size: .8rem; color: #5e7290; padding: 0 .5rem; white-space: nowrap; }
    .match-info strong { color: #1e4faf; }

    /* ---------- 卡片通用 ---------- */
    .card {
        background: white; border-radius: 1.5rem; padding: 1.5rem 1.75rem;
        box-shadow: 0 8px 24px -8px rgba(0,20,50,.12);
        border: 1px solid #fff; margin-bottom: 1.5rem;
        transition: opacity .2s;
    }
    .card.dimmed { opacity: .3; }
    .card-header {
        display: flex; align-items: center; gap: .6rem; margin-bottom: 1.1rem;
        padding-bottom: .8rem; border-bottom: 2px solid #e9effa;
    }
    .card-header .icon { font-size: 1.4rem; line-height: 1; }
    .card-header h2 { font-size: 1.15rem; font-weight: 700; color: #1e2e4a; flex: 1; }
    .card-header .count {
        font-size: .7rem; background: #eef4ff; color: #1e4faf;
        padding: .15rem .6rem; border-radius: 2rem; font-weight: 600;
    }
    mark { background: #fef08a; color: #713f12; padding: 0 2px; border-radius: 3px; font-weight: 600; }

    /* ---------- 核心判断 ---------- */
    .judgment-status {
        display: inline-flex; align-items: center; gap: .4rem;
        background: #fff7e6; color: #b45309; border: 1px solid #fcd34d;
        padding: .25rem .85rem; border-radius: 2rem; font-size: .78rem; font-weight: 600;
        margin-bottom: .9rem;
    }
    .judgment-headline { font-size: 1.2rem; font-weight: 700; color: #0b1e3a; margin-bottom: .7rem; }
    .judgment-body {
        font-size: .92rem; color: #1e2b41; line-height: 1.75;
        background: #f8fafd; padding: .9rem 1.1rem; border-radius: .9rem;
        border-left: 4px solid #3b82f6; margin-bottom: .9rem;
    }
    .judgment-impact {
        background: #fff7e6; border: 1px dashed #fcd34d; border-radius: .7rem;
        padding: .7rem 1rem; font-size: .88rem; color: #92400e; font-weight: 500;
    }

    /* ---------- 数据看板 ---------- */
    .dash-table { width: 100%; border-collapse: collapse; font-size: .84rem; margin-bottom: .9rem; }
    .dash-table th {
        background: #f0f5ff; color: #1e4faf; text-align: left;
        padding: .55rem .65rem; font-weight: 600; font-size: .78rem;
        border-bottom: 2px solid #e2eaf6; white-space: nowrap;
    }
    .dash-table td { padding: .6rem .65rem; border-bottom: 1px solid #eef2f9; vertical-align: top; color: #1e2b41; }
    .dash-table tr:last-child td { border-bottom: none; }
    .dash-table .val { font-weight: 700; color: #0b1e3a; white-space: nowrap; }
    .dash-table .chg.up { color: #0e6b2e; font-weight: 600; }
    .dash-table .chg.down { color: #b91c1c; font-weight: 600; }
    .dash-table .chg.neutral { color: #5e7290; }
    .dash-table .src { color: #7a8ca8; font-size: .76rem; }
    .dash-bg { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: .9rem; }
    .dash-bg span {
        font-size: .78rem; background: #eef4ff; color: #1e4faf;
        padding: .3rem .85rem; border-radius: 2rem; border: 1px solid #dbe7f5;
    }
    .dash-interpretation {
        font-size: .88rem; color: #2c3e5c; background: #f8fafd;
        padding: .85rem 1rem; border-radius: .85rem; border-left: 3px solid #3b82f6;
    }

    /* ---------- 事件 ---------- */
    .event-density {
        display: flex; flex-wrap: wrap; align-items: center; gap: .6rem;
        margin-bottom: .9rem; font-size: .84rem; color: #4a5e7c;
    }
    .event-density .label {
        background: #f0f5ff; color: #1e4faf; font-weight: 600;
        padding: .2rem .7rem; border-radius: 2rem; font-size: .76rem;
    }
    .event-item {
        border: 1px solid #e2eaf6; border-radius: .9rem; padding: .9rem 1.1rem;
        margin-bottom: .7rem; background: #f8fafd;
        transition: border .15s, box-shadow .15s;
    }
    .event-item:hover { border-color: #b9d1ff; box-shadow: 0 4px 12px -6px rgba(59,130,246,.2); }
    .event-item:last-child { margin-bottom: 0; }
    .event-title { font-weight: 700; font-size: .92rem; color: #0b1e3a; margin-bottom: .45rem; }
    .event-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .45rem; }
    .event-tags .tag {
        font-size: .68rem; padding: .12rem .55rem; border-radius: 2rem;
        background: #eef4ff; color: #1e4faf; font-weight: 500;
    }
    .event-tags .impact { font-weight: 700; }
    .event-tags .impact.up { background: #e6f7e6; color: #0e6b2e; }
    .event-tags .impact.down { background: #fee9e7; color: #b91c1c; }
    .event-tags .impact.neutral { background: #f0f3f8; color: #4a5e7c; }
    .event-analysis { font-size: .84rem; color: #2c3e5c; line-height: 1.6; border-top: 1px dashed #dbe7f5; padding-top: .45rem; }

    /* ---------- 证伪 ---------- */
    .fals-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .fals-table th {
        background: #f0f5ff; color: #1e4faf; text-align: left;
        padding: .55rem .55rem; font-weight: 600; font-size: .76rem;
        border-bottom: 2px solid #e2eaf6; white-space: nowrap;
    }
    .fals-table td { padding: .6rem .55rem; border-bottom: 1px solid #eef2f9; vertical-align: top; color: #1e2b41; line-height: 1.5; }
    .fals-table tr:last-child td { border-bottom: none; }
    .verdict { display: inline-block; padding: .12rem .55rem; border-radius: 2rem; font-size: .7rem; font-weight: 700; white-space: nowrap; }
    .verdict.down { background: #fee9e7; color: #b91c1c; }
    .verdict.up { background: #e6f7e6; color: #0e6b2e; }
    .verdict.neutral { background: #f0f3f8; color: #4a5e7c; }

    /* ---------- 下周关注 ---------- */
    .watch-list { display: flex; flex-direction: column; gap: .65rem; }
    .watch-item {
        display: flex; gap: .85rem; padding: .85rem .95rem;
        background: #f8fafd; border-radius: .9rem; border: 1px solid #e2eaf6;
    }
    .watch-num {
        flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
        background: #3b82f6; color: white; font-size: .75rem; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
    }
    .watch-title { font-weight: 700; font-size: .9rem; color: #0b1e3a; margin-bottom: .2rem; }
    .watch-detail { font-size: .83rem; color: #4a5e7c; line-height: 1.6; }

    .disclaimer {
        font-size: .76rem; color: #7a8ca8; font-style: italic;
        padding-top: .9rem; border-top: 1px dashed #dbe7f5; line-height: 1.6;
    }
    .empty-hint { font-size: .84rem; color: #94a3b8; text-align: center; padding: .9rem 0; font-style: italic; }

    /* ---------- 弹窗 ---------- */
    .modal-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(11,30,58,.55); backdrop-filter: blur(3px);
        z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-overlay.show { display: flex; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal {
        background: white; border-radius: 1.5rem; max-width: 680px; width: 100%;
        max-height: 85vh; overflow-y: auto; padding: 1.75rem; position: relative;
        box-shadow: 0 25px 60px -12px rgba(0,20,50,.45);
    }
    .modal-close {
        position: absolute; top: 1.1rem; right: 1.1rem;
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid #e2eaf6; background: #f8fafd; color: #3a5470;
        font-size: .95rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: all .15s;
    }
    .modal-close:hover { background: #fee9e7; border-color: #f5c2c0; color: #b91c1c; }
    .modal-header { display: flex; align-items: center; gap: .6rem; margin-bottom: .7rem; padding-right: 2.2rem; flex-wrap: wrap; }
    .modal-tag {
        background: #eef4ff; color: #1e4faf; padding: .18rem .7rem;
        border-radius: 2rem; font-size: .72rem; font-weight: 600; border: 1px solid #b9d1ff;
    }
    .modal-title { font-size: 1.3rem; font-weight: 700; color: #0b1e3a; line-height: 1.4; margin-bottom: .9rem; }
    .modal-section { font-size: .9rem; color: #1e2b41; line-height: 1.7; margin-bottom: .9rem; }
    .modal-section-title { font-size: .8rem; font-weight: 700; color: #1e4faf; margin-bottom: .3rem; }
    .modal-body p { margin-bottom: .7rem; color: #1e2b41; line-height: 1.7; }
    .modal-source { margin-top: 1rem; padding-top: .8rem; border-top: 1px dashed #dbe7f5; font-size: .76rem; color: #7a8ca8; font-style: italic; }

    .event-item.clickable { cursor: pointer; }
    .event-item.clickable:hover { border-color: #3b82f6; }
    .event-item.clickable .event-title::after {
        content: "›"; display: inline-block; margin-left: .35rem;
        color: #3b82f6; font-weight: 700; opacity: .5;
    }

    .footer { text-align: center; font-size: .78rem; color: #7a8ca8; padding: 1rem 0 .5rem; }

    @media (max-width: 700px) {
        .header { padding: 1.25rem 1.25rem; }
        .header-title h1 { font-size: 1.4rem; }
        .card { padding: 1.25rem 1.25rem; }
        .dash-table, .fals-table { display: block; overflow-x: auto; white-space: nowrap; }
        .control-bar { flex-direction: column; align-items: stretch; }
        .period-switch { justify-content: center; }
    }
</style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="header-top">
            <div class="header-title">
                <h1>
                    航电机载设备行业周报
                    <span class="period-badge" id="periodBadge">加载中...</span>
                </h1>
                <div class="header-meta">
                    <span id="dateRange"></span>
                    <span id="publisher"></span>
                </div>
            </div>
        </div>
        <div class="header-positioning" id="positioning"></div>
    </header>

    <div class="control-bar">
        <div class="period-switch">
            <button id="prevBtn" title="上一期">◀ 上一期</button>
            <div class="period-display" id="periodDisplay">第 ? 期<span class="date" id="periodDate"></span></div>
            <button id="nextBtn" title="下一期">下一期 ▶</button>
        </div>
        <select class="filter-select" id="issueSelect" title="选择期数"></select>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索关键词（标题、事件、指标、判断…）">
        </div>
        <select class="filter-select" id="boardFilter" title="按板块筛选">
            <option value="all">全部板块</option>
            <option value="coreJudgment">🎯 核心判断</option>
            <option value="dashboard">📊 高频数据</option>
            <option value="events">📡 事件扫描</option>
            <option value="falsification">🔍 证伪指标</option>
            <option value="nextWatch">📅 下周关注</option>
        </select>
        <select class="filter-select" id="tagFilter" title="按标签筛选">
            <option value="all">全部标签</option>
        </select>
        <span class="match-info" id="matchInfo"></span>
    </div>

    <!-- 一、本周核心判断 -->
    <section class="card" id="card-coreJudgment">
        <div class="card-header">
            <span class="icon">🎯</span><h2>一、本周核心判断</h2>
        </div>
        <div id="coreJudgment"></div>
    </section>

    <!-- 二、高频数据看板 -->
    <section class="card" id="card-dashboard">
        <div class="card-header">
            <span class="icon">📊</span><h2>二、高频数据看板</h2>
        </div>
        <div id="dashboard"></div>
    </section>

    <!-- 三、本周事件扫描 -->
    <section class="card" id="card-events">
        <div class="card-header">
            <span class="icon">📡</span><h2>三、本周事件扫描</h2>
            <span class="count" id="eventCount">0</span>
        </div>
        <div id="events"></div>
    </section>

    <!-- 四、证伪指标跟踪表 -->
    <section class="card" id="card-falsification">
        <div class="card-header">
            <span class="icon">🔍</span><h2>四、证伪指标跟踪表</h2>
        </div>
        <div id="falsification"></div>
    </section>

    <!-- 五、下周关注 -->
    <section class="card" id="card-nextWatch">
        <div class="card-header">
            <span class="icon">📅</span><h2>五、下周关注</h2>
        </div>
        <div id="nextWatch"></div>
    </section>

    <!-- 免责声明 -->
    <section class="card" id="card-disclaimer">
        <div class="disclaimer" id="disclaimer"></div>
    </section>

    <div class="footer" id="footer"></div>
</div>

<!-- 事件详情弹窗 -->
<div class="modal-overlay" id="eventModal">
    <div class="modal" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-header">
            <span class="modal-tag" id="modalType"></span>
            <span class="modal-tag" id="modalImpact"></span>
            <span class="modal-tag" id="modalArea"></span>
        </div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-section">
            <div class="modal-section-title">影响分析</div>
            <div id="modalAnalysis"></div>
        </div>
        <div class="modal-source" id="modalSource"></div>
    </div>
</div>

<script src="data.js"></script>
<script>
(function() {
    const state = { currentIndex: 0, keyword: '', boardFilter: 'all', tagFilter: 'all' };

    function escapeHtml(str) {
        if (typeof str !== 'string') return str == null ? '' : String(str);
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function highlight(text, keyword) {
        const safe = escapeHtml(String(text == null ? '' : text));
        if (!keyword) return safe;
        const words = keyword.trim().split(/\s+/).filter(Boolean);
        if (!words.length) return safe;
        let result = safe;
        words.forEach(w => {
            const escaped = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            result = result.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
        });
        return result;
    }
    function matchesKeyword(text, keyword) {
        if (!keyword) return true;
        const words = keyword.trim().split(/\s+/).filter(Boolean);
        if (!words.length) return true;
        const lower = String(text == null ? '' : text).toLowerCase();
        return words.some(w => lower.includes(w.toLowerCase()));
    }
    function getIssue() { return WEEKLY_DATA.issues[state.currentIndex] || null; }

    // 收集当前期所有标签
    function collectTags(issue) {
        const set = new Set();
        (issue.coreJudgment?.tags || []).forEach(t => set.add(t));
        (issue.dashboard?.indicators || []).forEach(i => i.tag && set.add(i.tag));
        (issue.events?.list || []).forEach(e => e.tag && set.add(e.tag));
        (issue.falsification || []).forEach(f => f.tag && set.add(f.tag));
        (issue.nextWatch || []).forEach(w => w.tag && set.add(w.tag));
        return [...set];
    }

    // ---------- 过滤 ----------
    function getFiltered() {
        const issue = getIssue();
        if (!issue) return null;
        const kw = state.keyword, board = state.boardFilter, tag = state.tagFilter;

        const tagMatch = t => tag === 'all' || t === tag;
        const kwMatch = (...texts) => !kw || texts.some(t => matchesKeyword(t, kw));

        // 核心判断
        let coreJudgment = null, cjVisible = true;
        const cj = issue.coreJudgment || {};
        if (board !== 'all' && board !== 'coreJudgment') cjVisible = false;
        if (tag !== 'all' && !(cj.tags || []).includes(tag)) cjVisible = false;
        if (kw && !kwMatch(cj.headline, cj.status, cj.body, cj.impact, ...(cj.tags || []))) cjVisible = false;
        if (cjVisible) coreJudgment = cj;

        // 数据
        let indicators = (issue.dashboard?.indicators || []).filter(i =>
            tagMatch(i.tag) && kwMatch(i.name, i.value, i.change, i.source)
        );
        let bg = (issue.dashboard?.background || []);
        let interp = issue.dashboard?.interpretation || '';
        let dashVisible = (board === 'all' || board === 'dashboard') &&
            (indicators.length > 0 || (!kw && !tag) || (kw && kwMatch(interp, ...bg)));
        if (board !== 'all' && board !== 'dashboard') dashVisible = false;

        // 事件
        let events = (issue.events?.list || []).filter(e =>
            tagMatch(e.tag) && kwMatch(e.title, e.type, e.impact, e.area, e.analysis)
        );
        let eventsVisible = (board === 'all' || board === 'events') && (events.length > 0 || (!kw && !tag));

        // 证伪
        let fals = (issue.falsification || []).filter(f =>
            tagMatch(f.tag) && kwMatch(f.indicator, f.previous, f.current, f.verdict, f.nextWatch)
        );
        let falsVisible = (board === 'all' || board === 'falsification') && (fals.length > 0 || (!kw && !tag));

        // 下周关注
        let watch = (issue.nextWatch || []).filter(w =>
            tagMatch(w.tag) && kwMatch(w.title, w.detail)
        );
        let watchVisible = (board === 'all' || board === 'nextWatch') && (watch.length > 0 || (!kw && !tag));

        return { issue, coreJudgment, cjVisible, indicators, bg, interp, dashVisible, events, eventsVisible, fals, falsVisible, watch, watchVisible };
    }

    // ---------- 渲染 ----------
    function renderHeader(issue) {
        document.getElementById('periodBadge').textContent = issue.period || '';
        document.getElementById('dateRange').textContent = issue.dateRange || '';
        document.getElementById('publisher').textContent = issue.publisher || '';
        document.getElementById('positioning').innerHTML = '<strong>周报定位：</strong>' + escapeHtml(issue.positioning || '');
        document.getElementById('footer').textContent = `${issue.publisher || ''} · ${issue.dateRange || ''}`;
    }

    function renderCoreJudgment(data) {
        const card = document.getElementById('card-coreJudgment');
        const el = document.getElementById('coreJudgment');
        if (!data.cjVisible) { card.classList.add('dimmed'); el.innerHTML = '<div class="empty-hint">暂无匹配内容</div>'; return; }
        card.classList.remove('dimmed');
        const cj = data.coreJudgment;
        el.innerHTML = `
            <div class="judgment-status">⚠️ ${highlight(cj.status, state.keyword)}</div>
            <div class="judgment-headline">${highlight(cj.headline, state.keyword)}</div>
            <div class="judgment-body">${highlight(cj.body, state.keyword)}</div>
            <div class="judgment-impact"><strong>影响判断：</strong>${highlight(cj.impact, state.keyword)}</div>
        `;
    }

    function renderDashboard(data) {
        const card = document.getElementById('card-dashboard');
        const el = document.getElementById('dashboard');
        if (!data.dashVisible) { card.classList.add('dimmed'); el.innerHTML = '<div class="empty-hint">暂无匹配数据</div>'; return; }
        card.classList.remove('dimmed');

        const rows = data.indicators.map(ind => `
            <tr>
                <td>${highlight(ind.name, state.keyword)}</td>
                <td class="val">${highlight(ind.value, state.keyword)}</td>
                <td class="chg ${ind.trendClass || 'neutral'}">${highlight(ind.change, state.keyword)}</td>
                <td>${escapeHtml(ind.freq)}</td>
                <td class="src">${escapeHtml(ind.source)}</td>
            </tr>
        `).join('') || '<tr><td colspan="5" class="empty-hint">暂无匹配指标</td></tr>';

        const bgHtml = data.bg.map(b => `<span>${highlight(b, state.keyword)}</span>`).join('');

        el.innerHTML = `
            <table class="dash-table">
                <thead><tr><th>指标</th><th>本周值</th><th>较上周/上期</th><th>数据频率</th><th>来源</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <div class="dash-bg">${bgHtml}</div>
            <div class="dash-interpretation"><strong>数据判读：</strong>${highlight(data.interp, state.keyword)}</div>
        `;
    }

    function renderEvents(data) {
        const card = document.getElementById('card-events');
        const el = document.getElementById('events');
        const cnt = document.getElementById('eventCount');
        if (!data.eventsVisible) { card.classList.add('dimmed'); el.innerHTML = '<div class="empty-hint">暂无匹配事件</div>'; cnt.textContent = '0'; return; }
        card.classList.remove('dimmed');
        cnt.textContent = data.events.length;

        const issue = data.issue;
        const densityHtml = `
            <div class="event-density">
                <span class="label">事件密度：${escapeHtml(issue.events?.density || '—')}</span>
                <span>${highlight(issue.events?.densityNote || '', state.keyword)}</span>
            </div>
        `;

        const itemsHtml = data.events.map(e => `
            <div class="event-item clickable" data-event-title="${escapeHtml(e.title)}">
                <div class="event-title">${highlight(e.title, state.keyword)}</div>
                <div class="event-tags">
                    <span class="tag">${escapeHtml(e.type)}</span>
                    <span class="tag impact ${e.impactClass || 'neutral'}">${escapeHtml(e.impact)}</span>
                    <span class="tag">${escapeHtml(e.area)}</span>
                </div>
                <div class="event-analysis">${highlight(e.analysis, state.keyword)}</div>
            </div>
        `).join('') || '<div class="empty-hint">暂无匹配事件</div>';

        el.innerHTML = densityHtml + itemsHtml;

        el.querySelectorAll('.event-item.clickable').forEach(itemEl => {
            itemEl.addEventListener('click', () => {
                const title = itemEl.dataset.eventTitle;
                const ev = data.events.find(x => x.title === title);
                if (ev) openEventModal(ev, data.issue);
            });
        });
    }

    function renderFalsification(data) {
        const card = document.getElementById('card-falsification');
        const el = document.getElementById('falsification');
        if (!data.falsVisible) { card.classList.add('dimmed'); el.innerHTML = '<div class="empty-hint">暂无匹配指标</div>'; return; }
        card.classList.remove('dimmed');

        const rows = data.fals.map(f => `
            <tr>
                <td><strong>${highlight(f.indicator, state.keyword)}</strong></td>
                <td>${highlight(f.previous, state.keyword)}</td>
                <td>${highlight(f.current, state.keyword)}</td>
                <td><span class="verdict ${f.verdictClass || 'neutral'}">${escapeHtml(f.verdict)}</span></td>
                <td>${highlight(f.nextWatch, state.keyword)}</td>
            </tr>
        `).join('') || '<tr><td colspan="5" class="empty-hint">暂无匹配指标</td></tr>';

        el.innerHTML = `
            <table class="fals-table">
                <thead><tr><th>跟踪指标</th><th>上期判断</th><th>本周状态</th><th>判定</th><th>下期观察点</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    function renderNextWatch(data) {
        const card = document.getElementById('card-nextWatch');
        const el = document.getElementById('nextWatch');
        if (!data.watchVisible) { card.classList.add('dimmed'); el.innerHTML = '<div class="empty-hint">暂无匹配关注</div>'; return; }
        card.classList.remove('dimmed');

        el.innerHTML = `<div class="watch-list">${data.watch.map((w, i) => `
            <div class="watch-item">
                <div class="watch-num">${i + 1}</div>
                <div>
                    <div class="watch-title">${highlight(w.title, state.keyword)}</div>
                    <div class="watch-detail">${highlight(w.detail, state.keyword)}</div>
                </div>
            </div>
        `).join('')}</div>`;
    }

    function renderDisclaimer(issue) {
        document.getElementById('disclaimer').textContent = issue.disclaimer || '';
    }

    // ---------- 弹窗 ----------
    function openEventModal(ev, issue) {
        document.getElementById('modalType').textContent = ev.type || '';
        document.getElementById('modalImpact').textContent = ev.impact || '';
        document.getElementById('modalArea').textContent = ev.area || '';
        document.getElementById('modalTitle').textContent = ev.title || '';
        document.getElementById('modalAnalysis').textContent = ev.analysis || '';
        document.getElementById('modalSource').textContent = issue.publisher ? `来源：${issue.publisher}` : '';

        const overlay = document.getElementById('eventModal');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeModal() {
        document.getElementById('eventModal').classList.remove('show');
        document.body.style.overflow = '';
    }

    // ---------- 期数切换 UI ----------
    function buildIssueOptions() {
        const sel = document.getElementById('issueSelect');
        sel.innerHTML = WEEKLY_DATA.issues.map((i, idx) =>
            `<option value="${idx}">${escapeHtml(i.period)} ${escapeHtml(i.dateRange || '')}</option>`
        ).join('');
        sel.value = state.currentIndex;
    }
    function buildTagOptions() {
        const issue = getIssue();
        const sel = document.getElementById('tagFilter');
        sel.innerHTML = '<option value="all">全部标签</option>';
        if (!issue) return;
        collectTags(issue).forEach(t => {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            sel.appendChild(opt);
        });
        sel.value = state.tagFilter;
    }
    function updatePeriodUI() {
        const issue = getIssue();
        const total = WEEKLY_DATA.issues.length;
        document.getElementById('periodDisplay').innerHTML =
            `${escapeHtml(issue.period || '')}<span class="date">${escapeHtml(issue.dateRange || '')}</span>`;
        document.getElementById('prevBtn').disabled = state.currentIndex >= total - 1;
        document.getElementById('nextBtn').disabled = state.currentIndex <= 0;
        const sel = document.getElementById('issueSelect');
        if (sel) sel.value = state.currentIndex;
    }

    function renderAll() {
        const data = getFiltered();
        if (!data) return;
        renderHeader(data.issue);
        renderCoreJudgment(data);
        renderDashboard(data);
        renderEvents(data);
        renderFalsification(data);
        renderNextWatch(data);
        renderDisclaimer(data.issue);
        updatePeriodUI();

        const total = (data.cjVisible ? 1 : 0) + data.indicators.length + data.events.length + data.fals.length + data.watch.length;
        document.getElementById('matchInfo').innerHTML =
            (state.keyword || state.tagFilter !== 'all' || state.boardFilter !== 'all')
                ? `匹配 <strong>${total}</strong> 条` : '';
    }

    // ---------- 事件绑定 ----------
    function bindEvents() {
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (state.currentIndex < WEEKLY_DATA.issues.length - 1) {
                state.currentIndex++; state.tagFilter = 'all';
                buildTagOptions(); renderAll();
            }
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (state.currentIndex > 0) {
                state.currentIndex--; state.tagFilter = 'all';
                buildTagOptions(); renderAll();
            }
        });
        document.getElementById('issueSelect').addEventListener('change', e => {
            const idx = parseInt(e.target.value, 10);
            if (!isNaN(idx) && idx >= 0 && idx < WEEKLY_DATA.issues.length) {
                state.currentIndex = idx; state.tagFilter = 'all';
                buildTagOptions(); renderAll();
            }
        });
        document.getElementById('searchInput').addEventListener('input', e => {
            state.keyword = e.target.value; renderAll();
        });
        document.getElementById('boardFilter').addEventListener('change', e => {
            state.boardFilter = e.target.value; renderAll();
        });
        document.getElementById('tagFilter').addEventListener('change', e => {
            state.tagFilter = e.target.value; renderAll();
        });
        // 弹窗关闭
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('eventModal').addEventListener('click', e => {
            if (e.target.id === 'eventModal') closeModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && document.getElementById('eventModal').classList.contains('show')) closeModal();
        });
    }

    function init() {
        if (typeof WEEKLY_DATA === 'undefined' || !WEEKLY_DATA.issues || !WEEKLY_DATA.issues.length) {
            document.body.innerHTML = '<div style="padding:3rem;text-align:center;color:#b91c1c;font-family:sans-serif;">⚠️ 数据加载失败，请检查 data.js 是否正确引入</div>';
            return;
        }
        buildIssueOptions();
        buildTagOptions();
        renderAll();
        bindEvents();
    }

    window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
